<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DeepSeek Harness Browser</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>DeepSeek Harness Browser</h1>
      <p id="status" role="status">Checking connection...</p>
      <button id="connect" type="button">Connect to DSH Web</button>
      <button id="disconnect" type="button" hidden>Disconnect</button>
      <button id="settings" type="button">Settings</button>
      <p class="hint">Connects to the DSH Web address from Settings (default http://127.0.0.1:3080) through a hidden background tab — no tab is opened. It also reconnects by itself after interruptions.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
